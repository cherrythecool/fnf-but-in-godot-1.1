[application]

name="Friday Night Funkin'"
main_scene="res://gameplay/game.scn"
icon="res://fnf_icon.png"
boot_splash="res://boot_splash.png"

[autoload]

Global="res://globals.scn"

[display]

width=1280
height=720
stretch_mode="2d"
stretch_aspect="keep"
driver="GLES2"

[image_loader]

gen_mipmaps=false

[input]

input_0=[key(A), key(Left)]
input_1=[key(S), key(Down)]
input_2=[key(K), key(Up)]
input_3=[key(L), key(Right)]
toggle_fullscreen=[key(F11)]

[render]

thread_model=1
